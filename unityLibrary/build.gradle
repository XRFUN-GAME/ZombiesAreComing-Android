apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'SpatialAdapterBackend', ext:'aar')
    implementation(name: 'tobservicelib-release', ext:'aar')
    implementation(name: 'platformloader', ext:'aar')
    implementation(name: 'PxrPlatform', ext:'aar')
    implementation(name: 'tob_api-release', ext:'aar')
    implementation(name: 'capturelib-release', ext:'aar')
    implementation(name: 'LoaderForUnitySDK', ext:'aar')
    implementation(name: 'CameraRenderingPlugin', ext:'aar')
    implementation project(':unityLibrary:xrmanifest.androidlib')
}

android {
    namespace "com.unity3d.player"
    ndkPath "D:/Unity/6000.0.49f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"
    ndkVersion "27.2.12479018"
    compileSdk 35
    buildToolsVersion = "34.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        consumerProguardFiles "proguard-unity.txt"
        versionName "1.1.1"
        minSdk 29
        targetSdk 35
        versionCode 1

        ndk {
            abiFilters "arm64-v8a"
            debugSymbolLevel "none"
        }
    }

    lint {
        abortOnError false
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp'] + unityStreamingAssets.tokenize(', ')
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}



def getSdkDir() {
    Properties local = new Properties()
    local.load(new FileInputStream("${rootDir}/local.properties"))
    return local.getProperty('sdk.dir')
}

def GetIl2CppOutputPath(String workingDir, String abi) {
    return "${workingDir}/src/main/jniLibs/${abi}/libil2cpp.so";
}

def GetIl2CppSymbolPath(String workingDir, String abi) {
    return "${workingDir}/symbols/${abi}/libil2cpp.so";
}

def BuildIl2CppImpl(String workingDir, String configuration, String architecture, String abi, String[] staticLibraries) {
    def commandLineArgs = []
    commandLineArgs.add("--compile-cpp")
    commandLineArgs.add("--platform=Android")
    commandLineArgs.add("--architecture=${architecture}")
    commandLineArgs.add("--outputpath=${workingDir}/src/main/jniLibs/${abi}/libil2cpp.so")
    commandLineArgs.add("--baselib-directory=${workingDir}/src/main/jniStaticLibs/${abi}")
    commandLineArgs.add("--incremental-g-c-time-slice=3")
    commandLineArgs.add("--configuration=${configuration}")
    commandLineArgs.add("--dotnetprofile=unityaot-linux")
    commandLineArgs.add("--usymtool-path=${workingDir}/src/main/Il2CppOutputProject/usymtool.exe")
    commandLineArgs.add("--profiler-report")
    commandLineArgs.add("--profiler-output-file=${workingDir}/build/il2cpp_${abi}_${configuration}/il2cpp_conv.traceevents")
    commandLineArgs.add("--print-command-line")
    commandLineArgs.add("--static-lib-il2-cpp")
    commandLineArgs.add("--data-folder=${workingDir}/src/main/Il2CppOutputProject/Source/il2cppOutput/data")
    commandLineArgs.add("--generatedcppdir=${workingDir}/src/main/Il2CppOutputProject/Source/il2cppOutput")
    commandLineArgs.add("--cachedirectory=${workingDir}/build/il2cpp_${abi}_${configuration}/il2cpp_cache")
    commandLineArgs.add("--tool-chain-path=${android.ndkDirectory}")

    staticLibraries.eachWithIndex {fileName, i->
        commandLineArgs.add("--additional-libraries=${workingDir}/src/main/jniStaticLibs/${abi}/${fileName}")
    }

    def executableExtension = ""
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        executableExtension = ".exe"
        commandLineArgs = commandLineArgs*.replace('\"', '\\\"')
    }
    exec {
        executable "${workingDir}/src/main/Il2CppOutputProject/IL2CPP/build/deploy/il2cpp${executableExtension}"
        args commandLineArgs
        environment "ANDROID_SDK_ROOT", getSdkDir()
    }

    def dbgLevel =  project.android.defaultConfig.ndk.debugSymbolLevel;
    def usePublicSymbols = dbgLevel == null || !dbgLevel.toString().toLowerCase().equals("full")
    def extensionToRemove = usePublicSymbols ? ".dbg.so" : ".sym.so"
    def extensionToKeep = usePublicSymbols ? ".sym.so" : ".dbg.so"

    delete "${workingDir}/src/main/jniLibs/${abi}/libil2cpp${extensionToRemove}"
    ant.move(file: "${workingDir}/src/main/jniLibs/${abi}/libil2cpp${extensionToKeep}", tofile: "${workingDir}/symbols/${abi}/libil2cpp.so")

}

android {
    tasks.register('buildIl2Cpp') {
        def workingDir = projectDir.toString().replaceAll('\\\\', '/');
        def archs = [
            'arm64' : 'arm64-v8a'
        ]
        def staticLibs = [
            'arm64' : [  ]
        ]
        inputs.files fileTree(dir: 'src/main/Il2CppOutputProject', include: ['**/*'])
        inputs.files fileTree(dir: 'src/main/jniStaticLibs', include: ['**/*'])
        archs.each { arch, abi ->
            outputs.file GetIl2CppOutputPath(workingDir, abi)
            outputs.file GetIl2CppSymbolPath(workingDir, abi)
        }
        // 已预编译时跳过：libil2cpp.so 已存在则不再调用 il2cpp 工具链
        onlyIf {
            !file(GetIl2CppOutputPath(workingDir, 'arm64-v8a')).exists()
        }
        doLast {
            archs.each { arch, abi ->
                BuildIl2CppImpl(workingDir, 'Release', arch, abi, staticLibs[arch] as String[]);
            }
        }
    }

    afterEvaluate {
        if (project(':unityLibrary').tasks.findByName('mergeDebugJniLibFolders'))
            project(':unityLibrary').mergeDebugJniLibFolders.dependsOn buildIl2Cpp
        if (project(':unityLibrary').tasks.findByName('mergeReleaseJniLibFolders'))
            project(':unityLibrary').mergeReleaseJniLibFolders.dependsOn buildIl2Cpp
    }

    // VibeLab: data.unity3d 超 GitHub 100MB 限制，仓库中以分片存放（vibelab-parts/）。
    // 本任务在构建前自动将分片按序拼接还原，并通过 sha256 校验完整性（纯 Groovy，不调用外部工具）。
    tasks.register('vibelabRestoreDataUnity3d') {
        def partsDir = new File(rootDir, 'vibelab-parts')
        def target = new File(projectDir, 'src/main/assets/bin/Data/data.unity3d')
        def expectedLen = 156767985L
        def expectedSha = '8e78ad90de028a827572c16c1d54a795e3bdc86c7093d2c39d113c55ff65388d'
        onlyIf {
            def need = !target.exists() || target.length() != expectedLen
            if (need) {
                def parts = ['data.unity3d.part-00', 'data.unity3d.part-01'].collect { new File(partsDir, it) }
                if (parts.every { it.exists() }) { return true }
                println '[vibelab] 还原条件不满足且分片缺失: parts=' + parts.findAll { !it.exists() }.collect { it.name }
            }
            return false
        }
        doLast {
            def parts = ['data.unity3d.part-00', 'data.unity3d.part-01'].collect { new File(partsDir, it) }
            parts.each { p ->
                if (!p.exists()) { throw new GradleException("[vibelab] 分片缺失: ${p}") }
            }
            println '[vibelab] 拼接分片 -> data.unity3d ...'
            target.parentFile.mkdirs()
            new FileOutputStream(target).withCloseable { out ->
                parts.each { p -> p.withInputStream { ins -> ins.transferTo(out) } }
            }
            def md = java.security.MessageDigest.getInstance('SHA-256')
            target.withInputStream { ins ->
                def buf = new byte[8192]
                int n
                while ((n = ins.read(buf)) > 0) { md.update(buf, 0, n) }
            }
            def actual = md.digest().collect { String.format('%02x', it) }.join()
            println "[vibelab] data.unity3d size=${target.length()} sha256=${actual}"
            if (actual != expectedSha) {
                target.delete()
                throw new GradleException("[vibelab] sha256 校验失败: ${actual}")
            }
            println '[vibelab] data.unity3d 还原并校验通过'
        }
    }

    tasks.named('preBuild') { dependsOn tasks.named('vibelabRestoreDataUnity3d') }
    sourceSets {
        main {
            jni.srcDirs = ["src/main/Il2CppOutputProject"]
        }
    }
}